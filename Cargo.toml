[package]
name = "nolelamphim-desktop"
version = "0.1.0"
edition = "2021"
authors = ["viennn <105200318@sv1.dut.udn.vn>"]
description = "A cross-platform native desktop movie discovery application built with Rust and Slint"
license = "MIT"
readme = "README.md"

[dependencies]
slint = { version = "~1.9.0", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
directories = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dotenvy = "0.15"

[build-dependencies]
slint-build = "~1.9.0"

[package.metadata.deb]
maintainer = "viennn <105200318@sv1.dut.udn.vn>"
copyright = "2026 viennn"
extended-description = """\
Nô Lệ Làm Phim Desktop is a modern, high-performance desktop movie discovery \
application for streaming Vietnamese and international movies, built with Rust and Slint."""
depends = "$auto, libfontconfig1, libxkbcommon0, libxkbcommon-x11-0, mpv"
section = "video"
priority = "optional"
assets = [
    ["target/release/nolelamphim-desktop", "usr/bin/", "755"],
    ["assets/nolelamphim-desktop.desktop", "usr/share/applications/", "644"],
    ["assets/icons/logo-128.png", "usr/share/icons/hicolor/128x128/apps/nolelamphim-desktop.png", "644"],
    ["assets/icons/logo.png", "usr/share/icons/hicolor/scalable/apps/nolelamphim-desktop.png", "644"],
    ["README.md", "usr/share/doc/nolelamphim-desktop/README", "644"],
]
