[package]
name = "nolelamphim-desktop"
version = "0.1.0"
edition = "2021"
authors = ["viennn"]
description = "A cross-platform native desktop movie discovery application built with Rust and Slint"

[dependencies]
slint = "~1.9.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
directories = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dotenvy = "0.15"

[build-dependencies]
slint-build = "~1.9.0"
