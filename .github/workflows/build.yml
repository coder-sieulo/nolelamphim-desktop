name: Auto Build & Release Artifacts

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nolelamphim-desktop-linux-x86_64
            binary_path: target/release/nolelamphim-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nolelamphim-desktop-windows-x64.exe
            binary_path: target/release/nolelamphim-desktop.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nolelamphim-desktop-macos-x64
            binary_path: target/release/nolelamphim-desktop

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (Slint GUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          which cargo-deb || cargo install cargo-deb --locked

      - name: Run Cargo Check
        run: cargo check --verbose

      - name: Build Release Binary
        run: cargo build --release --verbose

      - name: Build Debian Package (.deb)
        if: runner.os == 'Linux'
        run: cargo deb --verbose

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debian Package (.deb)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nolelamphim-desktop-ubuntu-deb
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.binary_path }}
            target/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
